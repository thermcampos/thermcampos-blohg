<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Watermark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap">
<style>
  :root { --bg: #15191a; --fg: #DFE6E9; --muted: #B2BEC3; --accent: #74B9FF; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "JetBrains Mono", monospace; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px; }
  .toolbar button, .toolbar label { font: 14px "JetBrains Mono", monospace; color: var(--fg); }
  .toolbar button { background: #2D3436; border: 1px solid #454B4D; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .toolbar button:hover { border-color: var(--accent); }
  .toolbar small { color: var(--muted); }
  .previews { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; padding: 0 16px 16px; }
  .previews figure { margin: 0; text-align: center; }
  .previews figcaption { font-size: 12px; color: var(--muted); margin-top: 8px; }
  /* checkerboard so transparency is visible */
  .checker { background: repeating-conic-gradient(#3a3f41 0 25%, #2b3032 0 50%) 0 0 / 16px 16px; display: inline-block; line-height: 0; }
  .video { background: linear-gradient(135deg, #6c5ce7, #00b894); width: 480px; max-width: 100%; aspect-ratio: 16/9; position: relative; border-radius: 6px; }
  .video img { position: absolute; right: 12px; bottom: 12px; width: 48px; height: 48px; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="download">Download PNG (150×150)</button>
  <label><input type="checkbox" id="transparent"> Transparent background</label>
  <small>YouTube shows the watermark small in the bottom-right corner, so it's kept to two bold elements.</small>
</div>
<div class="previews">
  <figure>
    <div class="checker">
      <svg id="mark" xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
        <defs>
          <style>.mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }</style>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2D3436"/>
            <stop offset="1" stop-color="#1b2022"/>
          </linearGradient>
        </defs>
        <rect id="plate" x="5" y="5" width="140" height="140" rx="30" fill="url(#bg)" stroke="#74B9FF" stroke-width="5"/>
        <g id="logo">
          <text id="label" x="0" y="0" class="mono" font-size="64" font-weight="800" letter-spacing="-4" fill="#DFE6E9">tc</text>
          <rect id="cursor" x="80" y="-9" width="34" height="9" rx="2" fill="#74B9FF"/>
        </g>
      </svg>
    </div>
    <figcaption>actual size</figcaption>
  </figure>
  <figure>
    <div class="video"><img id="preview" alt="watermark preview"></div>
    <figcaption>approximate look over a video</figcaption>
  </figure>
</div>
<script>
  const svg = document.getElementById('mark');

  // Centre "tc" + cursor in the square once the real font has loaded.
  function layout() {
    const label = document.getElementById('label');
    const cursor = document.getElementById('cursor');
    const b = label.getBBox();
    const gap = 6;
    cursor.setAttribute('x', b.x + b.width + gap);
    const width = b.width + gap + 34;
    const height = 48; // ≈ cap height of the text
    document.getElementById('logo').setAttribute('transform',
      `translate(${(150 - width) / 2 - b.x} ${(150 + height) / 2 - 4})`);
  }

  // Inline Google Fonts as data URIs so the canvas render uses the real font.
  async function fontCss() {
    try {
      let css = await (await fetch(document.getElementById('fonts').href)).text();
      const urls = [...new Set(css.match(/https:[^)]+\.woff2/g) || [])];
      for (const u of urls) {
        const blob = await (await fetch(u)).blob();
        const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        css = css.split(u).join(data);
      }
      return css;
    } catch (e) { return ''; }
  }

  async function svgDataUrl() {
    const clone = svg.cloneNode(true);
    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = await fontCss();
    clone.querySelector('defs').prepend(style);
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  }

  async function refreshPreview() {
    document.getElementById('preview').src = await svgDataUrl();
  }

  document.getElementById('transparent').addEventListener('change', e => {
    document.getElementById('plate').style.display = e.target.checked ? 'none' : '';
    refreshPreview();
  });

  document.getElementById('download').addEventListener('click', async () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = 150; c.height = 150;
      c.getContext('2d').drawImage(img, 0, 0, 150, 150);
      c.toBlob(b => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'youtube-watermark-150x150.png';
        a.click();
      }, 'image/png');
    };
    img.src = await svgDataUrl();
  });

  document.fonts.ready.then(() => { layout(); refreshPreview(); });
</script>
</body>
</html>
